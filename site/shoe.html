<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hypewise</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{var t=localStorage.getItem("hw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/* Layout: back link, hero (photo + big price), chart card with live readout, four figures, story + specs, links + signal. */
.back{display:inline-flex;gap:6px;font-size:14px;font-weight:600;color:var(--muted);text-decoration:none;width:max-content}
.back:hover{color:var(--ink)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:36px;align-items:center}
.photo{padding:10px}
.photo .cover{aspect-ratio:16/11}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);text-decoration:none}
.eyebrow:hover span{color:var(--accent)}
h1{font-weight:800;font-size:clamp(30px,5vw,50px);line-height:1.05;margin:14px 0 6px;text-wrap:balance}
.sku{font-family:var(--mono);font-size:13px;color:var(--muted)}
.bigprice{font-family:var(--display);font-weight:800;font-size:clamp(52px,9vw,84px);line-height:1;margin:22px 0 18px;letter-spacing:-.04em;font-variant-numeric:tabular-nums;width:max-content;max-width:100%}
.pills{display:flex;gap:10px;flex-wrap:wrap}
.pill{padding:10px 16px;border-radius:16px;min-width:0}
.pill small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pill b{font-family:var(--mono);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.note{margin:10px 8px 4px}
.card,.chartcard{padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.chartcard{padding:24px}
.card h2,.chartcard h2{font-size:20px;margin:0}
.chart-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.readout{display:flex;align-items:baseline;gap:12px;margin-top:6px;min-height:36px;font-size:13px;color:var(--muted)}
.readout b{font-family:var(--display);font-weight:700;font-size:30px;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--tint)}
.seg .chip{border:0;background:transparent;padding:7px 16px;box-shadow:none}
.seg .chip:disabled{opacity:.35;cursor:default}
.seg .chip[aria-pressed="true"]{background:var(--grad);color:#fff}
#chart{position:relative;width:100%}
#chart svg{display:block;width:100%;height:auto;overflow:visible}
#chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
#chart .pin circle{fill:var(--solid);stroke-width:2.5}
#chart .pin.hi circle{stroke:var(--up)} #chart .pin.lo circle{stroke:var(--down)}
#chart .pin text{font-size:11px;font-weight:500;fill:var(--ink)}
#chart .live{fill:var(--accent2);opacity:.35}
.tip{position:absolute;pointer-events:none;background:var(--solid);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(10px);border-radius:14px;padding:10px 14px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translate(-50%,-125%);z-index:2}
.tip b{font-family:var(--display);font-weight:700;font-size:20px;display:block;letter-spacing:-.02em}
.nochart{padding:60px 0;text-align:center;color:var(--muted)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.fig{padding:18px 20px}
.fig small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fig b{display:block;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin:4px 0 2px}
.fig span{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.story p{margin:0 0 6px;line-height:1.6}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 20px;font-size:15px}
dt{color:var(--muted)} dd{margin:0;text-align:right;overflow-wrap:anywhere;font-weight:600}
dd.mono{font-family:var(--mono);font-size:14px;font-weight:400}
.links{display:flex;gap:10px;flex-wrap:wrap}
.signal{border-style:dashed}
.signal .soon{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right;font-family:var(--mono)}
.tablewrap{max-height:320px;overflow:auto}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  #chart .ln.anim{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s .2s cubic-bezier(.4,0,.2,1) forwards}
  #chart .area.anim{opacity:0;animation:fadein .9s .9s forwards}
  #chart .live{transform-box:fill-box;transform-origin:center;animation:ping 2s ease-out infinite}
  @keyframes ping{0%{transform:scale(1);opacity:.5}100%{transform:scale(3.2);opacity:0}}
}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:22px}}
</style>
</head><body>
<div class="wrap">
  <nav>
    <div class="nav-left">
      <button id="theme" class="theme" type="button"></button>
      <a class="mark" href="./">Hype<span>wise</span></a>
    </div>
    <div class="links">
      <a href="./" data-i18n="nav.home">Home</a>
      <a href="board.html" data-i18n="nav.prices">Prices</a>
      <select id="lang" class="langsel" aria-label="Language"></select>
    </div>
  </nav>
  <a class="back" href="board.html">← <span data-i18n="d.back">All sneakers</span></a>
  <div id="view"><div class="empty" data-i18n="d.loading">Loading…</div></div>
  <footer><p data-i18n="foot1"></p><p data-i18n="foot2"></p></footer>
</div>
<script src="i18n.js?v=5"></script>
<script src="strings.js?v=5"></script>
<script src="app.js?v=5"></script>
<script src="ui.js?v=5"></script>
<script>
HW.mount(); UI.initTheme(); UI.backdrop(); UI.banner();
var D = window.HWD, $ = function (id) { return document.getElementById(id); };
var sku = new URLSearchParams(location.search).get("sku") || "";
var shoe = null, range = "all", demo = false, counted = false;

function dateFmt(ms, long) { return new Date(ms).toLocaleDateString(HW.locale(), long ? { day: "numeric", month: "long", year: "numeric" } : { month: "short", day: "numeric" }); }

function subset() {
  var p = shoe.prices, t = shoe.times;
  if (range === "all") return { prices: p, times: t };
  var days = range === "7" ? 7 : 30, from = t[t.length - 1] - days * D.DAY, pr = [], tm = [];
  for (var i = 0; i < p.length; i++) if (t[i] >= from) { pr.push(p[i]); tm.push(t[i]); }
  return { prices: pr, times: tm };
}

function niceStep(raw) { var e = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }

function curve(pts) {
  if (pts.length < 2) return "";
  var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (var i = 1; i < pts.length; i++) { var mx = (pts[i - 1][0] + pts[i][0]) / 2; d += " C" + mx.toFixed(1) + " " + pts[i - 1][1].toFixed(1) + " " + mx.toFixed(1) + " " + pts[i][1].toFixed(1) + " " + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1); }
  return d;
}
var drawn = false;
function drawChart() {
  var box = $("chart"), s = subset(), p = s.prices, t = s.times;
  if (p.length < 2) { box.innerHTML = '<div class="nochart">' + D.esc(HW.t("d.nochart")) + "</div>"; $("readout").innerHTML = ""; return; }
  var w = Math.max(280, box.clientWidth), h = Math.round(Math.max(260, Math.min(440, w * 0.46)));
  var m = { l: 56, r: 18, t: 22, b: 32 }, iw = w - m.l - m.r, ih = h - m.t - m.b;
  var mn = Math.min.apply(null, p), mx = Math.max.apply(null, p);
  if (mx === mn) { mn *= 0.95; mx *= 1.05; }
  var step = niceStep((mx - mn) / 4), y0 = Math.floor(mn / step) * step, y1 = Math.ceil(mx / step) * step;
  var t0 = t[0], t1 = t[t.length - 1], tr = (t1 - t0) || 1;
  var X = function (v) { return m.l + (v - t0) / tr * iw; }, Y = function (v) { return m.t + ih - (v - y0) / (y1 - y0) * ih; };
  var grid = "", ticks = "";
  for (var v = y0; v <= y1 + 1e-9; v += step) {
    grid += '<line x1="' + m.l + '" x2="' + (w - m.r) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" stroke="var(--line)" stroke-dasharray="2 5"/>';
    ticks += '<text x="' + (m.l - 10) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end">' + D.money(v) + "</text>";
  }
  var nx = Math.min(5, Math.max(2, Math.floor(iw / 100))), xl = "";
  for (var i = 0; i < nx; i++) {
    var tv = t0 + tr * i / (nx - 1), anchor = i === 0 ? "start" : i === nx - 1 ? "end" : "middle";
    xl += '<text x="' + X(tv).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="' + anchor + '">' + dateFmt(tv) + "</text>";
  }
  var pts = p.map(function (v, k) { return [X(t[k]), Y(v)]; });
  var line = curve(pts), base = m.t + ih;
  var area = line + " L" + pts[pts.length - 1][0].toFixed(1) + " " + base + " L" + pts[0][0].toFixed(1) + " " + base + " Z";
  var hi = p.indexOf(mx), lo = p.indexOf(Math.min.apply(null, p));
  function pin(k, cls, txt) { var q = pts[k], up = cls === "hi"; return '<g class="pin ' + cls + '"><circle cx="' + q[0].toFixed(1) + '" cy="' + q[1].toFixed(1) + '" r="4.5"/><text x="' + Math.min(Math.max(q[0], m.l + 30), w - m.r - 30).toFixed(1) + '" y="' + (q[1] + (up ? -12 : 20)).toFixed(1) + '" text-anchor="middle">' + txt + "</text></g>"; }
  var pins = p.length > 2 && hi !== lo ? pin(hi, "hi", D.money(p[hi])) + pin(lo, "lo", D.money(p[lo])) : "";
  var lp = pts[pts.length - 1];
  box.innerHTML = '<svg viewBox="0 0 ' + w + " " + h + '" width="' + w + '" height="' + h + '" role="img" aria-label="' + D.esc(HW.t("d.chart")) + '">' +
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.34"/><stop offset="1" style="stop-color:var(--accent2);stop-opacity:0"/></linearGradient>' +
    '<linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs>' +
    grid + ticks + xl + '<path class="area' + (drawn ? "" : " anim") + '" d="' + area + '" fill="url(#ag)"/><path id="ln" class="ln' + (drawn ? "" : " anim") + '" d="' + line + '" fill="none" stroke="url(#lg)" stroke-width="3.2" stroke-linecap="round" pathLength="1"/>' + pins +
    '<circle class="live" cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="5.5"/><circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="5.5" fill="var(--accent2)" stroke="var(--solid)" stroke-width="2.5"/>' +
    '<line id="gl" y1="' + m.t + '" y2="' + base + '" stroke="var(--muted)" stroke-dasharray="3 4" style="display:none"/>' +
    '<circle id="gd" r="6.5" fill="var(--accent)" stroke="var(--solid)" stroke-width="3" style="display:none"/>' +
    '<rect id="hit" x="' + m.l + '" y="' + m.t + '" width="' + iw + '" height="' + ih + '" fill="transparent" style="touch-action:pan-y"/></svg><div class="tip" id="tip" style="display:none"></div>';
  drawn = true;
  var ro = $("readout");
  function idle() { ro.innerHTML = "<span>" + D.esc(dateFmt(t1, true)) + "</span><b>" + D.money(p[p.length - 1]) + "</b>"; }
  idle();
  var hit = $("hit"), gl = $("gl"), gd = $("gd"), tip = $("tip");
  function show(ev) {
    var r = box.getBoundingClientRect(), x = ev.clientX - r.left, best = 0;
    for (var k = 1; k < pts.length; k++) if (Math.abs(pts[k][0] - x) < Math.abs(pts[best][0] - x)) best = k;
    var q = pts[best];
    gl.setAttribute("x1", q[0]); gl.setAttribute("x2", q[0]); gl.style.display = "";
    gd.setAttribute("cx", q[0]); gd.setAttribute("cy", q[1]); gd.style.display = "";
    var prev = best > 0 ? (p[best] - p[best - 1]) / p[best - 1] * 100 : null;
    tip.innerHTML = D.esc(dateFmt(t[best], true)) + "<b>" + D.money(p[best]) + "</b>" + (prev === null ? "" : '<span class="' + (prev > 0 ? "up" : prev < 0 ? "down" : "") + '">' + D.pct(prev, HW.locale()) + " " + D.esc(HW.t("d.vsprev")) + "</span>");
    tip.style.display = ""; tip.style.left = Math.min(Math.max(q[0], 90), w - 90) + "px"; tip.style.top = q[1] + "px";
    ro.innerHTML = "<span>" + D.esc(dateFmt(t[best], true)) + "</span><b>" + D.money(p[best]) + "</b>";
  }
  hit.addEventListener("pointermove", show); hit.addEventListener("pointerdown", show);
  hit.addEventListener("pointerleave", function () { gl.style.display = "none"; gd.style.display = "none"; tip.style.display = "none"; idle(); });
}

function story(st) {
  var loc = HW.locale(), L = [];
  if (st.n < 2) return [HW.f("st.one", { price: D.money(st.last), date: dateFmt(st.tlast, true) }).replace(/\.\.$/, ".")];
  L.push(HW.f("st.intro", { n: st.n, d1: dateFmt(st.tfirst, true), d2: dateFmt(st.tlast, true) }));
  var tot = (st.last - st.first) / st.first * 100, abs = Math.abs(tot).toLocaleString(loc, { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
  L.push(HW.f(Math.abs(tot) < 1 ? "st.flat" : tot > 0 ? "st.up" : "st.down", { pct: abs, p1: D.money(st.first), p2: D.money(st.last) }));
  L.push(HW.f("st.hl", { max: D.money(st.max), dmax: dateFmt(st.tmax, true), min: D.money(st.min), dmin: dateFmt(st.tmin, true) }));
  if (st.n >= 3) {
    var p = shoe.prices, base = (p[p.length - 2] + p[p.length - 3]) / 2, r = (st.last - base) / base * 100;
    L.push(HW.t(r > 1.5 ? "st.rup" : r < -1.5 ? "st.rdown" : "st.rflat"));
  }
  if (st.n < 6) L.push(HW.t("st.few"));
  return L.map(function (x) { return x.replace(/\.\.$/, "."); });
}

function row(k, v, mono) { return "<dt>" + D.esc(HW.t(k)) + "</dt><dd" + (mono ? ' class="mono"' : "") + ">" + D.esc(v) + "</dd>"; }

function view() {
  var loc = HW.locale(), x = shoe, st = D.stats(x), c7 = D.change(x, 7), tit = D.parseTitle(x.title, x.brand);
  document.title = tit.name + " · Hypewise";
  var fitKey = { men: "fit.men", women: "fit.women", kids: "fit.kids", unisex: "fit.unisex" }[x.gender] || (tit.fit ? "fit." + tit.fit : "fit.na");
  var all = (st.last - st.first) / st.first * 100, hasAll = st.n > 1 && st.tlast - st.tfirst > 5 * 36e5;
  var cls = function (v) { return v === null ? "flat" : v > 0.05 ? "up" : v < -0.05 ? "down" : "flat"; };
  var arrow = function (v) { return v === null ? "" : v > 0.05 ? "▲ " : v < -0.05 ? "▼ " : ""; };
  var q = encodeURIComponent(x.sku), stockx = x.link || ("https://stockx.com/search?s=" + q);
  var fig = function (k, val, sub) { return '<div class="fig glass rise" style="--i:' + (fig.i = (fig.i || 0) + 1) + '"><small>' + D.esc(HW.t(k)) + "</small><b>" + val + "</b><span>" + sub + "</span></div>"; };
  fig.i = 0;
  $("view").innerHTML =
    '<div style="display:flex;flex-direction:column;gap:28px">' +
    '<section class="hero"><div class="glass photo rise">' + D.cover(x, "l", D.vbadge(x, HW.t("v.badge"), HW.t("v.tip"))) + (x.image ? "" : '<p class="fine note">' + D.esc(HW.t("d.imgnote")) + "</p>") + "</div>" +
    '<div class="rise" style="--i:1"><a class="eyebrow" href="board.html?brand=' + encodeURIComponent(x.brand) + '">' + D.bmark(x.brand, 30) + "<span>" + D.esc(x.brand) + "</span></a><h1>" + D.esc(tit.name) + '</h1><span class="sku">' + D.esc(x.sku) + "</span>" +
    '<div class="bigprice grad-text" id="bp" data-v="' + st.last + '">' + D.money(st.last) + '</div><div class="pills">' +
    '<div class="pill glass"><small>' + D.esc(HW.t("d.chg7")) + '</small><b class="' + cls(c7) + '">' + (c7 === null ? "–" : arrow(c7) + D.pct(c7, loc)) + "</b></div>" +
    '<div class="pill glass"><small>' + D.esc(HW.t("d.chgAll")) + '</small><b class="' + cls(hasAll ? all : null) + '">' + (hasAll ? arrow(all) + D.pct(all, loc) : "–") + "</b></div></div></div></section>" +
    '<section class="glass chartcard rise" style="--i:2"><div class="chart-head"><div><h2>' + D.esc(HW.t("d.chart")) + '</h2><div class="readout" id="readout"></div></div><div class="ranges seg">' +
    ["7", "30", "all"].map(function (r) { var lab = HW.t(r === "7" ? "d.r7" : r === "30" ? "d.r30" : "d.rAll"); return '<button type="button" class="chip" data-r="' + r + '" aria-pressed="' + (r === range) + '">' + D.esc(lab) + "</button>"; }).join("") +
    '</div></div><p class="fine" style="font-size:14px">' + D.esc(HW.t("d.explain")) + '</p><div id="chart"></div>' +
    '<details><summary>' + D.esc(HW.t("d.table")) + '</summary><div class="tablewrap"><table><thead><tr><th>' + D.esc(HW.t("d.date")) + "</th><th>" + D.esc(HW.t("d.pricecol")) + "</th></tr></thead><tbody>" +
    x.prices.map(function (v, i) { return "<tr><td>" + D.esc(dateFmt(x.times[i], true)) + "</td><td>" + D.money(v) + "</td></tr>"; }).reverse().join("") + "</tbody></table></div></details></section>" +
    '<section class="figs">' +
    fig("d.low", D.money(st.min), D.esc(dateFmt(st.tmin, true))) + fig("d.high", D.money(st.max), D.esc(dateFmt(st.tmax, true))) + fig("d.avg", D.money(st.avg), "&nbsp;") + fig("d.reads", String(st.n), "&nbsp;") + "</section>" +
    '<section class="two"><div class="card glass story"><h2>' + D.esc(HW.t("d.story")) + "</h2>" + story(st).map(function (s) { return "<p>" + D.esc(s) + "</p>"; }).join("") + "</div>" +
    '<div class="card glass"><h2>' + D.esc(HW.t("d.specs")) + "</h2><dl>" +
    row("d.brand", x.brand) + row("d.model", tit.name) + row("d.year", x.year || tit.year || "–") + row("d.fit", HW.t(fitKey)) + row("d.cat", HW.t("d.catv")) + row("d.sku", x.sku, true) +
    row("d.src", HW.t("d.srcv")) + row("d.cur", "USD") + row("d.first", dateFmt(st.tfirst, true)) + row("d.last", dateFmt(st.tlast, true)) + "</dl></div></section>" +
    '<section class="two"><div class="card glass"><h2>' + D.esc(HW.t("d.other")) + '</h2><p class="fine" style="font-size:14px">' + D.esc(HW.t("d.otherp")) + '</p><div class="links">' +
    '<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="' + D.esc(stockx) + '">StockX ↗</a>' +
    '<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="https://www.goat.com/search?query=' + q + '">GOAT ↗</a>' +
    '<a class="btn ghost" target="_blank" rel="noopener noreferrer" href="https://www.ebay.com/sch/i.html?_nkw=' + q + '">eBay ↗</a></div></div>' +
    '<div class="card glass signal"><span class="soon">' + D.esc(HW.t("sig.soon")) + "</span><h2>" + D.esc(HW.t("d.sig")) + '</h2><p class="fine" style="font-size:14px">' + D.esc(HW.t("d.sigp")) + "</p></div></section></div>";
  Array.prototype.forEach.call(document.querySelectorAll(".ranges .chip"), function (b) {
    var r = b.dataset.r;
    if (r !== "all") { var days = Number(r), n = x.times.filter(function (tm) { return tm >= x.times[x.times.length - 1] - days * D.DAY; }).length; if (n < 2) b.disabled = true; }
    b.addEventListener("click", function () { range = r; drawn = false; Array.prototype.forEach.call(document.querySelectorAll(".ranges .chip"), function (o) { o.setAttribute("aria-pressed", String(o === b)); }); drawChart(); });
  });
  drawChart();
  if (!counted) { counted = true; UI.countUp($("bp"), st.last, function (v) { return D.money(v); }); }
}

function notFound() { $("view").innerHTML = '<div class="empty">' + D.esc(HW.t("d.notfound")) + "</div>"; }
