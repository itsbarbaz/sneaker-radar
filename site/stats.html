<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visits · Hypewise</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem("hw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=22">
<style>
.st{max-width:860px;margin:0 auto;padding:28px 16px 60px}
.st h1{font-size:clamp(28px,6vw,44px);margin:6px 0 4px}.st h2{margin:30px 0 10px;font-size:20px}
.st .note{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.tile{padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--surface)}
.tile b{display:block;font-size:34px;letter-spacing:-.03em;font-family:var(--display)}.tile small{color:var(--muted)}
.row{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px solid var(--line)}
.row.two{grid-template-columns:1fr 90px}.row span:last-child{text-align:right;font-weight:700}
.bar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent2));min-width:3px}
.row .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:inherit;cursor:pointer;font-weight:600}
.seg button.on{background:var(--accent);color:#fff;border-color:transparent}
</style></head><body>
<main class="st">
  <p class="note"><a href="./">← Hypewise</a></p>
  <h1>Visits</h1>
  <p class="note">Anonymous counts: no cookies, no IP addresses. "Sessions" = distinct browser-tab visits. Your own visits can be excluded: open the site once with <code>?nocount=1</code> on each device.</p>
  <div class="seg" id="seg"><button data-d="1">24 h</button><button data-d="7">7 days</button><button data-d="30" class="on">30 days</button></div>
  <div id="out"><p class="note">Loading…</p></div>
</main>
<script>
var URL_="https://fbxvrrppskilblmszlvo.supabase.co", KEY="sb_publishable_D1afxXoieLW5ORTAuqoytQ_MLrr7Viz", days=30;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function bars(rows,key,label){var m=Math.max.apply(null,rows.map(function(r){return r[key]}).concat([1]));return rows.map(function(r){return '<div class="row"><span>'+esc(r[label])+'</span><div><div class="bar" style="width:'+(r[key]/m*100)+'%"></div></div><span>'+r[key]+'</span></div>'}).join("")||'<p class="note">No data yet.</p>'}
function list(rows,key,label){return rows.map(function(r){return '<div class="row two"><span class="p">'+esc(r[label])+'</span><span>'+r[key]+'</span></div>'}).join("")||'<p class="note">No data yet.</p>'}
async function load(){
  var o=document.getElementById("out");
  try{
    var r=await fetch(URL_+"/rest/v1/rpc/visit_stats",{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify({days:days})});
    if(!r.ok) throw new Error(r.status);
    var s=await r.json(), d=s.daily||[], v=0,se=0; d.forEach(function(x){v+=x.views;se+=x.sessions});
    var today=d.length?d[d.length-1]:{views:0,sessions:0};
    o.innerHTML='<div class="tiles"><div class="tile"><b>'+v+'</b><small>page views ('+days+'d)</small></div><div class="tile"><b>'+se+'</b><small>sessions ('+days+'d, approx.)</small></div><div class="tile"><b>'+s.total.views+'</b><small>views, all time</small></div><div class="tile"><b>'+s.total.sessions+'</b><small>sessions, all time</small></div></div>'+
    '<h2>Per day</h2>'+bars(d.slice().reverse().map(function(x){return{d:x.d,views:x.views}}),"views","d")+
    '<h2>Where visitors come from</h2>'+list(s.refs,"sessions","ref")+'<h2>Top pages</h2>'+list(s.pages,"views","path")+'<h2>Languages</h2>'+list(s.langs,"views","lang");
  }catch(e){o.innerHTML='<p class="note">Counter not ready yet (the database table has not been created, or the connection failed).</p>'}
}
document.getElementById("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;days=+b.dataset.d;Array.prototype.forEach.call(this.children,function(x){x.classList.toggle("on",x===b)});load()});
load();
</script></body></html>
