<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hypewise Prices</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{var t=localStorage.getItem("hw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=13">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: floating pill nav, big gradient title, price ticker, three glass figures, filter pills, then one block per brand with a grid of glass sneaker cards. */
h1{font-weight:800;font-size:clamp(38px,7vw,68px);line-height:1;margin:0}
.sub{color:var(--muted);margin:12px 0 0;max-width:56ch;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{padding:18px 20px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:clamp(30px,4vw,40px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat small{display:block;margin-top:6px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.finder{position:sticky;top:10px;z-index:8;padding:16px;display:flex;flex-direction:column;gap:12px;border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.sbox{position:relative;display:flex;align-items:center;gap:12px;height:66px;padding:0 18px;border-radius:999px;background:var(--solid);border:2px solid transparent;
  background-image:linear-gradient(var(--solid),var(--solid)),linear-gradient(110deg,var(--accent),var(--accent2),var(--accent));background-origin:border-box;background-clip:padding-box,border-box;background-size:100% 100%,200% 100%;box-shadow:var(--glow);transition:transform .25s,box-shadow .25s}
.sbox:focus-within{transform:scale(1.015);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent),var(--glow)}
.sbox .mag{width:26px;height:26px;flex:none;stroke:var(--accent);fill:none;stroke-width:2.4;stroke-linecap:round;transition:transform .3s}
.sbox:focus-within .mag{transform:rotate(-12deg) scale(1.15);stroke:var(--accent2)}
.sbox input{flex:1;min-width:0;border:0;background:transparent;box-shadow:none;padding:0;font:600 clamp(17px,2.4vw,22px) var(--display);color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.sbox input::placeholder{color:var(--muted);opacity:.8}
.sbox .qc{border:0;background:var(--tint);color:var(--ink);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.sbox .res{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.frow .chips{flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.sbox{animation:sheen 6s linear infinite}@keyframes sheen{to{background-position:0 0,200% 0}}}
@media (max-width:640px){.sbox .res{display:none}.sbox{height:58px}.finder{top:6px}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip .n{opacity:.6;margin-left:6px;font-family:var(--mono);font-size:11px}
.brandsec{display:flex;flex-direction:column;gap:18px;scroll-margin-top:16px}
.brandsec>header{display:flex;align-items:center;gap:14px}
.brandsec h2{font-size:clamp(24px,4vw,34px);margin:0;line-height:1.1}
.brandsec header .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brandsec header .more{margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.scard{display:flex;flex-direction:column;gap:14px;text-decoration:none;padding:10px;min-width:0;transition:border-color .2s,box-shadow .2s,transform .2s}
.scard{position:relative}
.scard:hover,.scard:focus-visible{border-color:var(--accent2);box-shadow:0 0 0 3px var(--accent2),0 24px 50px -16px color-mix(in srgb,var(--accent2) 60%,transparent);transform:translateY(-6px);background:color-mix(in srgb,var(--accent2) 9%,var(--surface))}
.scard .open{position:absolute;right:20px;top:20px;z-index:2;display:inline-flex;gap:6px;align-items:center;padding:7px 14px;border-radius:999px;background:var(--accent2);color:#06281a;font:700 12px var(--display);opacity:0;transform:translateY(-6px) scale(.9);transition:.22s}
.scard:hover .open,.scard:focus-visible .open{opacity:1;transform:none}
.scard .cover{transition:transform .35s}
.scard:hover .cover{transform:scale(1.03)}
.scard:hover .price{color:var(--accent2)}
.scard .body{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 8px 8px}
.scard b{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.3;letter-spacing:-.02em;overflow-wrap:anywhere}
.scard .sku{font-family:var(--mono);font-size:11px;color:var(--muted)}
.scard .pr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.scard .price{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scard .chg{font-family:var(--mono);font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--tint)}
.scard .chg.up{background:color-mix(in srgb,var(--up) 16%,transparent)}
.scard .chg.down{background:color-mix(in srgb,var(--down) 16%,transparent)}
.scard svg.spark{margin-top:8px;max-width:100%}
.empty{padding:60px 0;color:var(--muted);text-align:center}

.explain{display:block;padding:0;font-size:14px}
.explain summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;padding:10px 16px;font-weight:600;font-size:14px}
.explain summary::-webkit-details-marker{display:none}
.explain .ii{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--grad);color:#fff;font:700 12px var(--display)}
.explain summary em{margin-left:auto;font-style:normal;font-size:12px;color:var(--accent);font-weight:700}
.explain summary em::after{content:" ▾"}
.explain[open] summary em::after{content:" ▴"}
.explain p{margin:0;padding:0 18px 14px 50px;line-height:1.6;color:color-mix(in srgb,var(--ink) 85%,transparent)}
.explain::before{content:none}
.chip{white-space:nowrap}
@media (max-width:860px){
  .finder{position:static}
  .frow{flex-direction:column;align-items:stretch;gap:10px}
  .frow .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .frow .chips::-webkit-scrollbar{display:none}
  .frow select{align-self:flex-start}
}

.bpick{display:none;align-items:stretch;gap:8px}
.bpick button{flex:none;width:48px;border-radius:16px;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:700 26px/1 var(--display);cursor:pointer}
.bpick button:active{background:var(--grad);color:#fff}
.bpick select{flex:1;min-width:0;height:48px;border-radius:16px;font:700 16px var(--display);padding:0 14px;background:var(--solid)}
.brandsec>header{flex-wrap:wrap}
.brandsec header .more{margin-left:auto}
.scard .cover{aspect-ratio:4/3}
.scard{border-radius:22px}
.grid{gap:18px}
.scard .body b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:860px){
  #brands{display:none}
  .bpick{display:flex}
  .frow{flex-direction:column;align-items:stretch}
  .frow select#sort{align-self:stretch;width:100%;height:44px}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .scard{padding:6px;gap:8px;border-radius:18px}
  .scard .cover{aspect-ratio:1/1;padding:8px}
  .scard .cover .big{font-size:90px}
  .scard .cover .verified{font-size:10px;padding:3px 7px}
  .scard .cover .verified svg{width:12px;height:12px}
  .scard .body{padding:0 6px 8px}
  .scard b{font-size:13px}
  .scard .sku{font-size:10px}
  .scard .pr{margin-top:6px;flex-wrap:wrap;gap:6px}
  .scard .price{font-size:19px}
  .scard .chg{font-size:11px;padding:3px 8px}
  .scard svg.spark{display:none}
  .scard .open{display:none}
  .brandsec>header .cnt{display:none}
}

.sp{font:800 11px var(--display);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:#fff;box-shadow:0 0 14px -2px var(--c)}
.sp.cop{--c:var(--up);background:#0b8a4c}.sp.sell{--c:var(--down);background:#d1365c}.sp.wait{--c:var(--wait);background:#a76a00}
@media (max-width:860px){#sigf{width:100%;height:44px}}
@media (max-width:560px){.scard .cover .sp{font-size:9px;padding:3px 7px}}
</style>
</head><body data-title="b.title">
<div class="wrap">
  <nav>
    <div class="nav-left">
      <button id="theme" class="theme" type="button"></button>
      <a class="mark" href="./">Hype<span>wise</span></a>
    </div>
    <div class="links">
      <a href="./" data-i18n="nav.home">Home</a>
      <a href="board.html" aria-current="page" data-i18n="nav.prices">Prices</a>
      <select id="lang" class="langsel" aria-label="Language"></select>
    </div>
  </nav>

  <header class="rise">
    <h1 class="grad-text" data-i18n="b.h1">Sneaker prices</h1>
    <p class="sub" data-i18n="b.sub"></p>
  </header>

  <div class="finder glass">
    <label class="sbox" for="q">
      <svg class="mag" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" autocomplete="off" data-i18n-aria="f.title">
      <button type="button" id="qclear" class="qc" hidden data-i18n="f.clear">Clear</button>
      <span class="res" id="res"></span>
    </label>
    <div class="frow">
      <div class="chips" id="brands" role="group" data-i18n-aria="b.brand"></div>
      <div class="bpick" id="bpick">
        <button type="button" id="bprev" data-i18n-aria="b.prev">‹</button>
        <select id="bsel" data-i18n-aria="b.brandpick"></select>
        <button type="button" id="bnext" data-i18n-aria="b.next">›</button>
      </div>
      <select id="sigf" data-i18n-aria="sg.mini">
        <option value="all" data-i18n="sf.all"></option>
        <option value="cop" data-i18n="cop.name"></option>
        <option value="wait" data-i18n="wait.name"></option>
        <option value="sell" data-i18n="sell.name"></option>
      </select>
      <select id="sort" data-i18n-aria="b.sortlabel">
        <option value="move" data-i18n="b.sort.move"></option>
        <option value="price" data-i18n="b.sort.price"></option>
        <option value="name" data-i18n="b.sort.name"></option>
      </select>
    </div>
    <p class="fine" id="stamp"></p>
  </div>

  <div class="ticker" id="ticker" hidden aria-label="Top movers"></div>
  <details class="explain glass">
    <summary><span class="ii">i</span><span data-i18n="b.how">How to read this page</span><em data-i18n="b.more">Read more</em></summary>
    <p data-i18n="b.explain"></p>
  </details>

  <div class="demo" id="demo" data-i18n="b.demo" hidden></div>
  <section class="stats" id="stats" data-i18n-aria="b.summary"></section>

<div id="list" aria-live="polite"></div>
  <footer><p data-i18n="b.foot"></p><p data-i18n="l.brandsnote"></p></footer>
</div>

<script src="i18n.js?v=13"></script>
<script src="strings.js?v=13"></script>
<script src="app.js?v=13"></script>
<script src="signal.js?v=13"></script>
<script src="ui.js?v=13"></script>
<script>
HW.mount(); UI.initTheme(); UI.backdrop(); UI.banner(); UI.footer(); UI.sync();
var D = window.HWD, ALL = "__all__", PAGE = 8, state = { items: [], brand: ALL, demo: false, ready: false, shown: {} };
var $ = function (id) { return document.getElementById(id); };
var fromUrl = new URLSearchParams(location.search).get("brand"); if (fromUrl) state.brand = fromUrl;
var firstRender = true;

function limitFor(b, searching) { return state.shown[b] || (state.brand !== ALL || searching ? 24 : PAGE); }

function render() {
  var q = $("q").value.trim().toLowerCase(), sort = $("sort").value, loc = HW.locale(), searching = !!q;
  var rows = state.items.filter(function (x) { return !q || (x.title + " " + x.sku).toLowerCase().indexOf(q) > -1; })
    .map(function (x) { return Object.assign({}, x, { price: x.prices[x.prices.length - 1], chg: D.change(x, 7), sig: HWSignal.signal(x) }); })
    .filter(function (x) { var f = $("sigf").value; return f === "all" || x.sig.verdict === f; });
  var out = $("list");
  $("res").textContent = HW.f("f.res", { n: rows.length });
  if (!rows.length) { out.innerHTML = '<div class="empty">' + D.esc(HW.t(state.items.length ? "b.nomatch" : "b.nodata")) + "</div>"; return; }
  var by = {}; rows.forEach(function (x) { (by[x.brand] = by[x.brand] || []).push(x); });
  var brands = Object.keys(by).sort(function (a, b) { return D.brandRank(a) - D.brandRank(b) || a.localeCompare(b); });
  if (state.brand !== ALL) brands = brands.filter(function (b) { return b === state.brand; });
  var delay = 0, vt = HW.t("v.badge"), vtip = HW.t("v.tip");
  out.innerHTML = '<div style="display:flex;flex-direction:column;gap:56px">' + brands.map(function (b) {
    var list = by[b].sort(function (a, c) {
      return sort === "price" ? c.price - a.price : sort === "name" ? a.title.localeCompare(c.title)
        : (c.chg === null ? -1 : Math.abs(c.chg)) - (a.chg === null ? -1 : Math.abs(a.chg));
    });
    var lim = limitFor(b, searching), vis = list.slice(0, lim), rest = list.length - vis.length;
    return '<section class="brandsec" id="brand-' + D.esc(b.replace(/\s+/g, "-")) + '"><header>' + D.bmark(b, 46) + "<h2>" + D.esc(b) + '</h2><span class="cnt">' + D.esc(HW.f("b.models", { n: list.length })) + "</span>" +
      (rest > 0 ? '<button type="button" class="chip more" data-more="' + D.esc(b) + '">' + D.esc(HW.f(state.brand === ALL && !searching && !state.shown[b] ? "b.showall" : "b.showmore", { n: list.length })) + "</button>" : "") +
      '</header><div class="grid">' + vis.map(function (x) {
        var none = x.chg === null, cls = none ? "flat" : x.chg > 0.05 ? "up" : x.chg < -0.05 ? "down" : "flat", i = firstRender ? Math.min(delay++, 16) : 0;
        return '<a class="scard glass' + (firstRender ? " rise" : "") + '" style="--i:' + i + '" href="shoe.html?sku=' + encodeURIComponent(x.sku) + '"><span class="open">' + D.esc(HW.t("f.open")) + ' →</span>' + D.cover(x, "s", D.vbadge(x, vt, vtip) + (x.sig.verdict !== "none" ? '<span class="sp ' + x.sig.verdict + '">' + D.esc(HW.t(x.sig.verdict === "cop" ? "cop.name" : x.sig.verdict === "sell" ? "sell.name" : "wait.name")) + "</span>" : "")) +
          '<div class="body"><b>' + D.esc(x.title) + '</b><span class="sku">' + D.esc(x.sku) + "</span>" +
          '<div class="pr"><span class="price">' + D.money(x.price) + '</span><span class="chg ' + cls + '">' + (none ? D.esc(HW.t("b.collecting")) : D.pct(x.chg, loc)) + "</span></div>" +
          D.spark(x.prices, x.times) + "</div></a>";
      }).join("") + "</div></section>";
  }).join("") + "</div>";
  firstRender = false;
}

function pickSync(brands, counts) {
  var sel = $("bsel"); sel.innerHTML = [ALL].concat(brands).map(function (x) { return '<option value="' + D.esc(x) + '">' + D.esc(x === ALL ? HW.t("b.all") : x + " (" + counts[x] + ")") + "</option>"; }).join("");
  sel.value = state.brand; state.order = [ALL].concat(brands);
}
function chips() {
  var counts = {}; state.items.forEach(function (x) { counts[x.brand] = (counts[x.brand] || 0) + 1; });
  var brands = Object.keys(counts).sort(function (a, b) { return D.brandRank(a) - D.brandRank(b) || a.localeCompare(b); });
  pickSync(brands, counts);
  $("brands").innerHTML = [ALL].concat(brands).map(function (b) {
    return '<button type="button" class="chip" aria-pressed="' + (b === state.brand) + '" data-b="' + D.esc(b) + '">' + D.esc(b === ALL ? HW.t("b.all") : b) +
      (b === ALL ? "" : '<span class="n">' + counts[b] + "</span>") + "</button>";
  }).join("");
}

function setup(items, demo, animate) {
  state.items = items; state.demo = demo; state.ready = true;
  $("demo").hidden = !demo;
  var brands = {}; items.forEach(function (x) { brands[x.brand] = 1; });
  var movers = items.filter(function (x) { var c = D.change(x, 7); return c !== null && Math.abs(c) >= 5; }).length;
  var vals = [items.length, Object.keys(brands).length, movers];
  $("stats").innerHTML = ["b.stat1", "b.stat2", "b.stat3"].map(function (k, i) { return '<div class="stat glass rise" style="--i:' + i + '"><b data-v="' + vals[i] + '">' + vals[i] + "</b><small>" + D.esc(HW.t(k)) + "</small></div>"; }).join("");
  if (animate) Array.prototype.forEach.call(document.querySelectorAll("#stats b"), function (b) { UI.countUp(b, Number(b.dataset.v)); });
  var last = items.reduce(function (m, x) { return Math.max(m, x.times[x.times.length - 1]); }, 0);
  $("stamp").textContent = last ? HW.t("b.updated") + " " + new Date(last).toLocaleDateString(HW.locale(), { day: "numeric", month: "long", year: "numeric" }) : "";
  var mv = items.map(function (x) { return { label: x.title.replace(/\s*\([^)]*\)/g, ""), value: x.prices[x.prices.length - 1], chg: D.change(x, 7) }; })
    .filter(function (m) { return m.chg !== null; }).sort(function (a, b) { return Math.abs(b.chg) - Math.abs(a.chg); }).slice(0, 14);
  UI.ticker($("ticker"), mv, function (v) { return D.pct(v, HW.locale()); });
  chips(); render();
}

$("brands").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; state.brand = b.dataset.b; state.shown = {}; chips(); render(); });
$("list").addEventListener("click", function (e) { var b = e.target.closest("[data-more]"); if (!b) return; var n = b.dataset.more; state.shown[n] = (state.shown[n] || (state.brand !== ALL ? 24 : PAGE)) + 48; render(); });
$("q").addEventListener("input", function () { state.shown = {}; $("qclear").hidden = !$("q").value; render(); });
$("qclear").addEventListener("click", function () { $("q").value = ""; $("qclear").hidden = true; state.shown = {}; render(); $("q").focus(); });
(function () { var k = 0, ph = ["f.ph1", "f.ph2", "f.ph3", "f.ph4"]; function set() { $("q").placeholder = HW.t(ph[k]); } set(); document.addEventListener("hw-lang", set);
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(function () { if (document.activeElement !== $("q") && !$("q").value) { k = (k + 1) % ph.length; set(); } }, 2800); })();
$("sort").addEventListener("change", render);
$("sigf").addEventListener("change", function () { state.shown = {}; render(); });
function goBrand(v) { state.brand = v; state.shown = {}; chips(); render(); }
$("bsel").addEventListener("change", function () { goBrand(this.value); });
function step(d) { var o = state.order || [ALL], i = o.indexOf(state.brand); goBrand(o[(i + d + o.length) % o.length]); }
$("bprev").addEventListener("click", function () { step(-1); });
$("bnext").addEventListener("click", function () { step(1); });
document.addEventListener("hw-lang", function () { if (state.ready) setup(state.items, state.demo, false); });

(async function () {
  try { setup(await D.loadAll(), false, true); }
  catch (e) { console.warn("Supabase unreachable, showing sample data", e); setup(D.demoData(), true, true); }
})();
</script>
</body></html>
