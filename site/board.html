<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hypewise Prices</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: nav, page title, three figures, filters, then one section per brand with a grid of sneaker cards. */
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6vw,48px);line-height:1;letter-spacing:-.025em;margin:0}
.sub{color:var(--muted);margin:8px 0 0;max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:2px 0 2px 12px;border-left:3px solid var(--accent)}
.stat b{display:block;font-family:var(--mono);font-weight:500;font-size:26px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.tools{display:flex;flex-direction:column;gap:12px}
.tools .row1{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:180px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip .n{opacity:.6;margin-left:6px;font-family:var(--mono);font-size:12px}
.brandsec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.brandsec>header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.brandsec h2{font-family:var(--display);font-size:clamp(24px,4vw,32px);margin:0;letter-spacing:-.02em}
.brandsec header span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.scard{display:flex;flex-direction:column;gap:12px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.scard:hover{border-color:var(--accent)}
.scard .body{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 4px 4px}
.scard b{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.scard .sku{font-family:var(--mono);font-size:12px;color:var(--muted)}
.scard .pr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.scard .price{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums}
.scard .chg{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.scard svg.spark{margin-top:6px;max-width:100%}
.empty{padding:40px 0;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.scard{transition:transform .12s,border-color .12s}.scard:hover{transform:translateY(-2px)}}
</style>
</head><body data-title="b.title">
<div class="wrap">
  <nav>
    <a class="mark" href="./">Hype<span>wise</span></a>
    <div class="links">
      <a href="./" data-i18n="nav.home">Home</a>
      <a href="board.html" aria-current="page" data-i18n="nav.prices">Prices</a>
      <select id="lang" class="langsel" aria-label="Language"></select>
    </div>
  </nav>

  <header>
    <h1 data-i18n="b.h1">Sneaker prices</h1>
    <p class="sub" data-i18n="b.sub"></p>
  </header>

  <div class="demo" id="demo" data-i18n="b.demo" hidden></div>
  <section class="stats" id="stats" data-i18n-aria="b.summary"></section>

  <div class="tools">
    <div class="row1">
      <input type="search" id="q" data-i18n-ph="b.search" data-i18n-aria="b.search">
      <select id="sort" data-i18n-aria="b.sortlabel">
        <option value="move" data-i18n="b.sort.move"></option>
        <option value="price" data-i18n="b.sort.price"></option>
        <option value="name" data-i18n="b.sort.name"></option>
      </select>
    </div>
    <div class="chips" id="brands" role="group" data-i18n-aria="b.brand"></div>
    <p class="fine" id="stamp"></p>
  </div>

  <div id="list" aria-live="polite"></div>
  <footer><p data-i18n="b.foot"></p></footer>
</div>

<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="app.js"></script>
<script>
HW.mount();
var D = window.HWD, ALL = "__all__", state = { items: [], brand: ALL, demo: false, ready: false };
var $ = function (id) { return document.getElementById(id); };
var fromUrl = new URLSearchParams(location.search).get("brand"); if (fromUrl) state.brand = fromUrl;

function render() {
  var q = $("q").value.trim().toLowerCase(), sort = $("sort").value, loc = HW.locale();
  var rows = state.items.filter(function (x) { return !q || (x.title + " " + x.sku).toLowerCase().indexOf(q) > -1; })
    .map(function (x) { return Object.assign({}, x, { price: x.prices[x.prices.length - 1], chg: D.change(x, 7) }); });
  var out = $("list");
  if (!rows.length) { out.innerHTML = '<div class="empty">' + D.esc(HW.t(state.items.length ? "b.nomatch" : "b.nodata")) + "</div>"; return; }
  var by = {};
  rows.forEach(function (x) { (by[x.brand] = by[x.brand] || []).push(x); });
  var brands = Object.keys(by).sort(function (a, b) { return D.brandRank(a) - D.brandRank(b) || a.localeCompare(b); });
  if (state.brand !== ALL) brands = brands.filter(function (b) { return b === state.brand; });
  out.innerHTML = '<div style="display:flex;flex-direction:column;gap:48px">' + brands.map(function (b) {
    var list = by[b].sort(function (a, c) {
      return sort === "price" ? c.price - a.price : sort === "name" ? a.title.localeCompare(c.title)
        : (c.chg === null ? -1 : Math.abs(c.chg)) - (a.chg === null ? -1 : Math.abs(a.chg));
    });
    return '<section class="brandsec" id="brand-' + D.esc(b.replace(/\s+/g, "-")) + '"><header><h2>' + D.esc(b) + "</h2><span>" + D.esc(HW.f("b.models", { n: list.length })) + '</span></header><div class="grid">' +
      list.map(function (x) {
        var none = x.chg === null, cls = none ? "flat" : x.chg > 0.05 ? "up" : x.chg < -0.05 ? "down" : "flat";
        return '<a class="scard" href="shoe.html?sku=' + encodeURIComponent(x.sku) + '">' + D.shoeImage(x, "s") +
          '<div class="body"><b>' + D.esc(x.title) + '</b><span class="sku">' + D.esc(x.sku) + "</span>" +
          '<div class="pr"><span class="price">' + D.money(x.price) + '</span><span class="chg ' + cls + '">' + (none ? D.esc(HW.t("b.collecting")) : D.pct(x.chg, loc)) + "</span></div>" +
          D.spark(x.prices, x.times) + "</div></a>";
      }).join("") + "</div></section>";
  }).join("") + "</div>";
}

function chips() {
  var counts = {}; state.items.forEach(function (x) { counts[x.brand] = (counts[x.brand] || 0) + 1; });
  var brands = Object.keys(counts).sort(function (a, b) { return D.brandRank(a) - D.brandRank(b) || a.localeCompare(b); });
  $("brands").innerHTML = [ALL].concat(brands).map(function (b) {
    return '<button type="button" class="chip" aria-pressed="' + (b === state.brand) + '" data-b="' + D.esc(b) + '">' + D.esc(b === ALL ? HW.t("b.all") : b) +
      (b === ALL ? "" : '<span class="n">' + counts[b] + "</span>") + "</button>";
  }).join("");
}

function setup(items, demo) {
  state.items = items; state.demo = demo; state.ready = true;
  $("demo").hidden = !demo;
  var brands = {}; items.forEach(function (x) { brands[x.brand] = 1; });
  var movers = items.filter(function (x) { var c = D.change(x, 7); return c !== null && Math.abs(c) >= 5; }).length;
  $("stats").innerHTML =
    '<div class="stat"><b>' + items.length + "</b><small>" + D.esc(HW.t("b.stat1")) + "</small></div>" +
    '<div class="stat"><b>' + Object.keys(brands).length + "</b><small>" + D.esc(HW.t("b.stat2")) + "</small></div>" +
    '<div class="stat"><b>' + movers + "</b><small>" + D.esc(HW.t("b.stat3")) + "</small></div>";
  var last = items.reduce(function (m, x) { return Math.max(m, x.times[x.times.length - 1]); }, 0);
  $("stamp").textContent = last ? HW.t("b.updated") + " " + new Date(last).toLocaleDateString(HW.locale(), { day: "numeric", month: "long", year: "numeric" }) : "";
  chips(); render();
}

$("brands").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; state.brand = b.dataset.b; chips(); render(); });
$("q").addEventListener("input", render);
$("sort").addEventListener("change", render);
document.addEventListener("hw-lang", function () { if (state.ready) setup(state.items, state.demo); });

(async function () {
  try { setup(await D.loadAll(), false); }
  catch (e) { console.warn("Supabase unreachable, showing sample data", e); setup(D.demoData(), true); }
})();
</script>
</body></html>
