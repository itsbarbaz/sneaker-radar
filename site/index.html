<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hypewise</title>
<meta name="description" content="Hypewise tracks US sneaker resale prices and shows you when to buy, wait or sell.">
<meta name="claude:viewport-fit-sides" content="cover">
<script>try{var t=localStorage.getItem("hw-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: aurora hero (headline + live sample card), price ticker, three how-it-works tiles, signal cards, brands row, closing call to action. */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:center;padding-top:20px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 18px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 25%,transparent)}
h1{font-weight:800;font-size:clamp(44px,8vw,88px);line-height:.98;margin:0;letter-spacing:-.045em;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:50ch;margin:22px 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.sample{padding:22px;display:flex;flex-direction:column;gap:16px;transform:rotate(1.2deg)}
.sample .tag{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
.sample .tag span{padding:4px 11px;border-radius:999px;background:var(--tint)}
.sample .tag span:first-child{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent)}
.sample h3{margin:0;font-size:22px}
.sample .sku{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sample .px{display:flex;align-items:baseline;gap:12px}
.sample .px b{font-family:var(--display);font-weight:800;font-size:48px;letter-spacing:-.04em}
.sample .px span{font-family:var(--mono);font-size:13px;color:var(--down)}
.sample svg{width:100%;height:auto}
.sample .verdict{border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--tint)}
.sample .v{font-family:var(--display);font-weight:700;color:var(--wait)}
.sample .verdict p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bento{display:flex;flex-direction:column;gap:22px}
.bento h2,.final h2{font-size:clamp(28px,4.5vw,46px);margin:0}
.intro{color:var(--muted);max-width:62ch;margin:10px 0 0;font-size:17px}
.cols,.verd,.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.col,.vcard{padding:24px}
.col .n{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500}
.col h3,.vcard .name{font-size:21px;margin:10px 0 6px}
.col p,.vcard p,.two p{margin:0;color:var(--muted);font-size:15px}
.vcard{border-top:3px solid var(--c)}
.vcard.cop{--c:var(--up)} .vcard.wait{--c:var(--wait)} .vcard.sell{--c:var(--down)}
.vcard .name{display:block;font-family:var(--display);font-weight:700}
.soon{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;margin-left:12px;vertical-align:middle}
.brandrow{display:flex;flex-wrap:wrap;gap:10px}
.two h3{margin:0 0 6px;font-size:19px}
.final{text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{padding:18px 22px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:36px}.sample{transform:none}}
@media (prefers-reduced-motion:no-preference){.sample{animation:float 7s ease-in-out infinite}.sample .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s .4s ease forwards}@keyframes float{50%{transform:rotate(1.2deg) translateY(-10px)}}}
</style>
</head><body>
<div class="wrap">
  <nav>
    <div class="nav-left">
      <button id="theme" class="theme" type="button" aria-pressed="false"><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13a9 9 0 1 1-10-10 7 7 0 0 0 10 10z"/></svg><span class="knob"></span></button>
      <a class="mark" href="./">Hype<span>wise</span></a>
    </div>
    <div class="links">
      <a href="#come" data-i18n="nav.how">How it works</a>
      <a href="#segnale" data-i18n="nav.signal">The signal</a>
      <a href="board.html" data-i18n="nav.prices">Prices</a>
      <select id="lang" class="langsel" aria-label="Language"></select>
      <a class="btn" href="board.html" data-i18n="nav.open">Open the board</a>
    </div>
  </nav>

  <section class="hero">
    <div class="rise">
      <p class="eyebrow" data-i18n="hero.eyebrow">Sneaker resale prices, USA</p>
      <h1 data-i18n-html="hero.h1">Buy with your <em>head.</em></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="cta">
        <a class="btn" href="board.html" data-i18n="nav.open">Open the board</a>
        <a class="btn ghost" href="#come" data-i18n="hero.cta2">How it works</a>
      </div>
    </div>
    <aside class="sample glass rise" style="--i:2" aria-label="Sample sneaker card">
      <div class="tag"><span data-i18n="card.tag"></span><span data-i18n="card.tag2"></span></div>
      <div><h3>Jordan 4 Retro Black Cat</h3><span class="sku">Jordan · CU1110-010</span></div>
      <div class="px"><b>$285</b><span data-i18n="card.chg"></span></div>
      <svg viewBox="0 0 320 90" role="img" aria-label="Sample 30-day price chart">
        <defs><linearGradient id="hg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs>
        <line x1="0" y1="20" x2="320" y2="20" stroke="var(--line)" stroke-dasharray="2 5"/><line x1="0" y1="45" x2="320" y2="45" stroke="var(--line)" stroke-dasharray="2 5"/><line x1="0" y1="70" x2="320" y2="70" stroke="var(--line)" stroke-dasharray="2 5"/>
        <path class="ln" pathLength="1" d="M4 52 C30 50 40 40 56 40 S96 28 108 30 S150 18 160 20 S200 26 212 32 S250 48 264 52 S300 62 314 64" fill="none" stroke="url(#hg)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="314" cy="64" r="4.5" fill="var(--down)"/>
      </svg>
      <div class="verdict"><div class="v" data-i18n="card.v"></div><p data-i18n="card.vp"></p></div>
      <p class="fine" data-i18n="card.fine"></p>
    </aside>
  </section>

  <div class="ticker" id="ticker" hidden aria-label="Top movers"></div>
  <section class="stats" id="stats"></section>

  <section class="bento" id="come">
    <div><h2 data-i18n="how.h"></h2><p class="intro" data-i18n="how.intro"></p></div>
    <div class="cols">
      <div class="col glass scroll-rise"><span class="n" data-i18n="s1.n"></span><h3 data-i18n="s1.h"></h3><p data-i18n="s1.p"></p></div>
      <div class="col glass scroll-rise"><span class="n" data-i18n="s2.n"></span><h3 data-i18n="s2.h"></h3><p data-i18n="s2.p"></p></div>
      <div class="col glass scroll-rise"><span class="n" data-i18n="s3.n"></span><h3 data-i18n="s3.h"></h3><p data-i18n="s3.p"></p></div>
    </div>
  </section>

  <section class="bento" id="segnale">
    <div><h2><span data-i18n="sig.h"></span><span class="soon" data-i18n="sig.soon"></span></h2><p class="intro" data-i18n="sig.intro"></p></div>
    <div class="verd">
      <div class="vcard cop glass scroll-rise"><span class="name" data-i18n="cop.name"></span><p data-i18n="cop.p"></p></div>
      <div class="vcard wait glass scroll-rise"><span class="name" data-i18n="wait.name"></span><p data-i18n="wait.p"></p></div>
      <div class="vcard sell glass scroll-rise"><span class="name" data-i18n="sell.name"></span><p data-i18n="sell.p"></p></div>
    </div>
    <p class="fine" data-i18n="sig.fine"></p>
  </section>

  <section class="bento" id="copertura">
    <div><h2 data-i18n="l.brands">Brands we track</h2><p class="intro" data-i18n="cov.intro"></p></div>
    <div class="brandrow" id="brandrow"></div>
    <p class="fine" data-i18n="l.brandsnote"></p>
    <div class="two">
      <div><h3 data-i18n="who1.h"></h3><p data-i18n="who1.p"></p></div>
      <div><h3 data-i18n="who2.h"></h3><p data-i18n="who2.p"></p></div>
    </div>
  </section>

  <section class="final glass">
    <h2 data-i18n="final.h"></h2>
    <a class="btn" href="board.html" data-i18n="nav.open">Open the board</a>
  </section>

  <footer><p data-i18n="foot1"></p><p data-i18n="foot2"></p></footer>
</div>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script>
HW.mount(); UI.initTheme();
var D = window.HWD, BR = ["Jordan","Nike","adidas","New Balance","ASICS","Saucony","Salomon","HOKA","On","Vans","Converse"];
function brands() { document.getElementById("brandrow").innerHTML = BR.map(D.bchip).join(""); }
brands();
(async function () {
  try {
    var items = await D.loadAll(), set = {}; items.forEach(function (x) { set[x.brand] = 1; });
    var vals = [items.length, Object.keys(set).length];
    document.getElementById("stats").innerHTML = ["b.stat1", "b.stat2"].map(function (k, i) { return '<div class="stat glass rise" style="--i:' + i + '"><b>' + vals[i] + "</b><small>" + D.esc(HW.t(k)) + "</small></div>"; }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#stats b"), function (b, i) { UI.countUp(b, vals[i]); });
    function tick() {
      var mv = items.map(function (x) { return { label: x.title.replace(/\s*\([^)]*\)/g, ""), value: x.prices[x.prices.length - 1], chg: D.change(x, 7) }; })
        .filter(function (m) { return m.chg !== null; }).sort(function (a, b) { return Math.abs(b.chg) - Math.abs(a.chg); }).slice(0, 14);
      UI.ticker(document.getElementById("ticker"), mv, function (v) { return D.pct(v, HW.locale()); });
    }
    tick();
  } catch (e) { console.warn("live data unavailable", e); }
})();
</script>
</body></html>
