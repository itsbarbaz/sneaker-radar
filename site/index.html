<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hypewise</title>
<meta name="description" content="Hypewise tracks US sneaker resale prices and shows you when to buy, wait or sell.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: wordmark masthead, a hero with one verdict card as the focal object, then three ruled bands (how it works, the signal, coverage) and a closing call to action. */
:root{
  --bg:#f3f1ed; --surface:#fbfaf8; --ink:#1b1a18; --muted:#6a675f; --line:#dedad2;
  --accent:#e2461c; --on-accent:#fff; --up:#14804a; --down:#c2262e; --wait:#a76a00;
  --display:"Familjen Grotesk",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12110f;--surface:#1a1917;--ink:#efece6;--muted:#a09c93;--line:#2d2b27;--accent:#ff6a3d;--on-accent:#1b0b04;--up:#3fc27d;--down:#ff6b72;--wait:#e6b04a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12110f;--surface:#1a1917;--ink:#efece6;--muted:#a09c93;--line:#2d2b27;--accent:#ff6a3d;--on-accent:#1b0b04;--up:#3fc27d;--down:#ff6b72;--wait:#e6b04a;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:72px}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.mark{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;text-decoration:none}
.mark span{color:var(--accent)}
nav .links{display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:15px}
nav .links a{text-decoration:none;color:var(--muted)}
nav .links a:hover{color:var(--ink)}
.btn{display:inline-block;font-family:var(--display);font-weight:600;font-size:16px;text-decoration:none;padding:12px 20px;border-radius:6px;background:var(--accent);color:var(--on-accent)!important;border:2px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--ink)!important;border-color:var(--ink)}
nav .btn{padding:8px 14px;font-size:14px}
.langsel{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:48px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(42px,8vw,84px);line-height:.95;letter-spacing:-.035em;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.lead{font-size:19px;max-width:46ch;margin:22px 0 28px;color:var(--ink)}
.cta{display:flex;gap:12px;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card .tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card h3{font-family:var(--display);font-size:20px;line-height:1.25;margin:0}
.card .sku{font-family:var(--mono);font-size:12px;color:var(--muted)}
.card .px{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.card .px b{font-family:var(--mono);font-weight:500;font-size:34px;font-variant-numeric:tabular-nums}
.card .px span{font-family:var(--mono);font-size:14px;color:var(--down)}
.card svg{width:100%;height:auto;display:block}
.verdict{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.verdict .v{font-family:var(--display);font-weight:700;font-size:22px;color:var(--wait)}
.verdict p{margin:0;font-size:14px;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin:0}

h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.5vw,40px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
.band{border-top:2px solid var(--ink);padding-top:20px;display:flex;flex-direction:column;gap:28px}
.intro{max-width:60ch;color:var(--muted);margin:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.col{min-width:0;border-left:3px solid var(--line);padding-left:16px}
.col .n{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.08em}
.col h3{font-family:var(--display);font-size:21px;margin:4px 0 6px;line-height:1.2}
.col p{margin:0;color:var(--muted);font-size:15px}
.soon{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:8px}

.verd{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.verd .card{gap:8px}
.verd .name{font-family:var(--display);font-weight:700;font-size:26px}
.verd .cop .name{color:var(--up)}.verd .wait .name{color:var(--wait)}.verd .sell .name{color:var(--down)}
.verd p{margin:0;font-size:15px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:15px}
.chips span.later{border-style:dashed;color:var(--muted)}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px}
.two h3{font-family:var(--display);font-size:22px;margin:0 0 6px}
.two p{margin:0;color:var(--muted)}

.final{background:var(--ink);color:var(--bg);border-radius:12px;padding:clamp(24px,5vw,48px);display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.final h2{color:var(--bg);max-width:18ch}
.final .btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)!important}
footer{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}
footer p{margin:0;max-width:80ch}

@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);gap:32px}.wrap{gap:56px}}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .12s}.btn:hover{transform:translateY(-2px)}}
</style>

</head><body>
<div class="wrap">
  <nav>
    <a class="mark" href="./">Hype<span>wise</span></a>
    <div class="links">
      <a href="#come" data-i18n="nav.how">How it works</a>
      <a href="#segnale" data-i18n="nav.signal">The signal</a>
      <a href="#copertura" data-i18n="nav.cover">What we track</a>
      <select id="lang" class="langsel" aria-label="Language"></select>
      <a class="btn" href="board.html" data-i18n="nav.open">Open the board</a>
    </div>
  </nav>

  <section class="hero">
    <div>
      <p class="eyebrow" data-i18n="hero.eyebrow">Sneaker resale prices, USA</p>
      <h1 data-i18n-html="hero.h1">Buy with your <em>head.</em></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="cta">
        <a class="btn" href="board.html" data-i18n="nav.open">Open the board</a>
        <a class="btn ghost" href="#come" data-i18n="hero.cta2">How it works</a>
      </div>
    </div>

    <aside class="card" aria-label="Esempio di scheda scarpa">
      <div class="tag"><span data-i18n="card.tag"></span><span data-i18n="card.tag2"></span></div>
      <div>
        <h3>Jordan 4 Retro Black Cat</h3>
        <span class="sku">Jordan · CU1110-010</span>
      </div>
      <div class="px"><b>$285</b><span data-i18n="card.chg"></span></div>
      <svg viewBox="0 0 320 90" role="img" aria-label="Grafico di esempio del prezzo negli ultimi 30 giorni">
        <line x1="0" y1="20" x2="320" y2="20" stroke="var(--line)" stroke-width="1"/>
        <line x1="0" y1="45" x2="320" y2="45" stroke="var(--line)" stroke-width="1"/>
        <line x1="0" y1="70" x2="320" y2="70" stroke="var(--line)" stroke-width="1"/>
        <path d="M4 52 L30 48 L56 40 L82 36 L108 30 L134 24 L160 20 L186 24 L212 32 L238 44 L264 52 L290 60 L314 64" fill="none" stroke="var(--down)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="314" cy="64" r="4" fill="var(--down)"/>
      </svg>
      <div class="verdict">
        <div class="v" data-i18n="card.v"></div>
        <p data-i18n="card.vp"></p>
      </div>
      <p class="fine" data-i18n="card.fine"></p>
    </aside>
  </section>

  <section class="band" id="come">
    <div>
      <h2 data-i18n="how.h"></h2>
      <p class="intro" data-i18n="how.intro"></p>
    </div>
    <div class="cols">
      <div class="col"><span class="n" data-i18n="s1.n"></span><h3 data-i18n="s1.h"></h3><p data-i18n="s1.p"></p></div>
      <div class="col"><span class="n" data-i18n="s2.n"></span><h3 data-i18n="s2.h"></h3><p data-i18n="s2.p"></p></div>
      <div class="col"><span class="n" data-i18n="s3.n"></span><h3 data-i18n="s3.h"></h3><p data-i18n="s3.p"></p></div>
    </div>
  </section>

  <section class="band" id="segnale">
    <div>
      <h2><span data-i18n="sig.h"></span><span class="soon" data-i18n="sig.soon"></span></h2>
      <p class="intro" data-i18n="sig.intro"></p>
    </div>
    <div class="verd">
      <div class="card cop"><span class="name" data-i18n="cop.name"></span><p data-i18n="cop.p"></p></div>
      <div class="card wait"><span class="name" data-i18n="wait.name"></span><p data-i18n="wait.p"></p></div>
      <div class="card sell"><span class="name" data-i18n="sell.name"></span><p data-i18n="sell.p"></p></div>
    </div>
    <p class="fine" data-i18n="sig.fine"></p>
  </section>

  <section class="band" id="copertura">
    <div>
      <h2 data-i18n="cov.h"></h2>
      <p class="intro" data-i18n="cov.intro"></p>
    </div>
    <div class="chips">
      <span>Jordan</span><span>Nike</span><span>adidas</span><span>New Balance</span><span>ASICS</span><span>Saucony</span><span>Salomon</span><span>HOKA</span><span>On</span><span>Vans</span><span>Converse</span>
      <span class="later" data-i18n="cov.later"></span>
    </div>
    <div class="two">
      <div><h3 data-i18n="who1.h"></h3><p data-i18n="who1.p"></p></div>
      <div><h3 data-i18n="who2.h"></h3><p data-i18n="who2.p"></p></div>
    </div>
  </section>

  <section class="final">
    <h2 data-i18n="final.h"></h2>
    <a class="btn" href="board.html" data-i18n="nav.open">Open the board</a>
  </section>

  <footer>
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
  </footer>
</div>
<script src="i18n.js"></script>
<script>HW.mount();</script>
</body></html>
