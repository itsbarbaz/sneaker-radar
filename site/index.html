<style>
/* Layout: aurora hero (headline + live sample card), price ticker, three how-it-works tiles, signal cards, brands row, closing call to action. */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start;padding-top:20px}
.hero>div.rise{padding-top:clamp(0px,5vw,70px)}
.sample .cover{aspect-ratio:16/9}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 18px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 25%,transparent)}
h1{font-weight:800;font-size:clamp(44px,8vw,88px);line-height:.98;margin:0;letter-spacing:-.045em;text-wrap:balance}
h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:50ch;margin:22px 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.sample{background:var(--solid);-webkit-backdrop-filter:none;backdrop-filter:none;padding:14px 22px 22px;display:flex;flex-direction:column;gap:16px;position:relative}
.hero{position:relative}
html,body{overflow-x:clip}
.orb{position:absolute;border-radius:50%;filter:blur(60px);z-index:-1;pointer-events:none}
.orb.a{width:340px;height:340px;right:0;top:-40px;background:var(--aur1)}
.orb.b{width:300px;height:300px;left:0;bottom:-60px;background:var(--aur2)}
.eyebrow b.rot{display:inline-block;min-width:7ch;color:var(--ink);transition:opacity .35s,transform .35s}
.eyebrow b.rot.off{opacity:0;transform:translateY(8px)}
.sample .tag{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
.sample .tag span{padding:4px 11px;border-radius:999px;background:var(--tint)}
.sample .tag span:first-child{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 14%,transparent)}
.sample h3{margin:0;font-size:22px}
.sample .sku{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sample .px{display:flex;align-items:baseline;gap:12px}
.sample .px b{font-family:var(--display);font-weight:800;font-size:48px;letter-spacing:-.04em}
.sample .px span{font-family:var(--mono);font-size:13px;color:var(--down)}
.sample svg{width:100%;height:auto}
.sample .verdict{border:1px solid var(--line);border-radius:16px;padding:12px 16px;background:var(--tint)}
.sample .v{font-family:var(--display);font-weight:700;color:var(--wait)}
.sample .verdict p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.bento{display:flex;flex-direction:column;gap:22px}
.bento h2,.final h2{font-size:clamp(28px,4.5vw,46px);margin:0}
.intro{color:var(--muted);max-width:62ch;margin:10px 0 0;font-size:17px}
.cols,.verd,.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.col,.vcard{padding:24px}
.col .ico,.vcard .ico{margin-bottom:6px}
.col .n{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:500}
.col h3,.vcard .name{font-size:21px;margin:10px 0 6px}
.col p,.vcard p,.two p{margin:0;color:var(--muted);font-size:15px}
.vcard{border-top:3px solid var(--c)}
.vcard.cop{--c:var(--up)} .vcard.wait{--c:var(--wait)} .vcard.sell{--c:var(--down)}
.vcard .name{display:block;font-family:var(--display);font-weight:700}
.soon{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;margin-left:12px;vertical-align:middle}
.brandrow{display:flex;flex-wrap:wrap;gap:10px}
.two h3{margin:0 0 6px;font-size:19px}
.final{text-align:center;padding:60px 24px;display:flex;flex-direction:column;align-items:center;gap:22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{padding:18px 22px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr);gap:36px}}
@media (prefers-reduced-motion:no-preference){.sample .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2s .4s ease forwards}}

.community{padding:clamp(22px,4vw,40px);margin:34px 0;position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line))}
.community::before{content:"";position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:var(--aur1);filter:blur(70px);opacity:.7;pointer-events:none}
.community>*{position:relative}
.community h2{margin:10px 0 10px;font-size:clamp(26px,4.6vw,42px);line-height:1.05;letter-spacing:-.03em}
.community p{max-width:62ch;color:var(--muted);margin:0 0 12px}
.cm-actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0 6px}
.cm-actions .btn{display:inline-flex;align-items:center;gap:9px}
.cm-actions svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cm-mail{font-size:14px;margin-top:14px;color:var(--muted)}.cm-mail a{color:var(--text);font-weight:700}
.cm-soon{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:18px;font-size:13px;color:var(--muted)}
.cm-soon .pill{padding:6px 12px;border-radius:999px;border:1px dashed var(--line);background:var(--surface);font-weight:600;color:var(--text)}
.sample .v.cop{color:var(--up)}.sample .v.sell{color:var(--down)}
.sample .cover img{object-fit:cover}
</style>

<script>
HW.mount(); UI.initTheme(); UI.backdrop(); UI.banner(); UI.footer();
var D = window.HWD, BR = ["Jordan","Nike","adidas","New Balance","ASICS","Saucony","Salomon","HOKA","On","Vans","Converse"];
function brands() { document.getElementById("brandrow").innerHTML = BR.map(function (b, i) { return D.bchip(b, i); }).join(""); }
brands();
document.getElementById("samplecover").innerHTML = D.cover({ brand: "Jordan", title: "Jordan 4 Retro Black Cat", image: null }, "s", "");
(function () { var r = document.getElementById("rot"), k = 0; if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  setInterval(function () { r.classList.add("off"); setTimeout(function () { k = (k + 1) % BR.length; r.textContent = BR[k]; r.classList.remove("off"); }, 350); }, 2200); })();
(async function () {
  try {
    var items = await D.loadAll(), set = {}; items.forEach(function (x) { set[x.brand] = 1; });
    var vals = [items.length, Object.keys(set).length];
    document.getElementById("stats").innerHTML = ["b.stat1", "b.stat2"].map(function (k, i) { return '<div class="stat glass rise" style="--i:' + i + '"><b>' + vals[i] + "</b><small>" + D.esc(HW.t(k)) + "</small></div>"; }).join("");
    Array.prototype.forEach.call(document.querySelectorAll("#stats b"), function (b, i) { UI.countUp(b, vals[i]); });
    function tick() {
      var mv = items.map(function (x) { return { label: x.title.replace(/\s*\([^)]*\)/g, ""), value: x.prices[x.prices.length - 1], chg: D.change(x, 7) }; })
        .filter(function (m) { return m.chg !== null; }).sort(function (a, b) { return Math.abs(b.chg) - Math.abs(a.chg); }).slice(0, 14);
      UI.ticker(document.getElementById("ticker"), mv, function (v) { return D.pct(v, HW.locale()); });
    }
    function liveHero() {
      var cand = items.filter(function (x) { return x.image && x.prices.length >= 8; }), best = null, bc = 0;
      cand.forEach(function (x) { var c = D.change(x, 7); if (c !== null && Math.abs(c) <= 30 && Math.abs(c) > bc) { best = x; bc = Math.abs(c); } });
      if (!best) best = cand[0]; if (!best) return;
      var x = best, tit = D.parseTitle(x.title, x.brand), c7 = D.change(x, 7), n = x.prices.length, last = x.prices[n - 1];
      var from = x.times[n - 1] - 30 * 864e5, P = [], T = [];
      x.prices.forEach(function (v, i) { if (x.times[i] >= from) { P.push(v); T.push(x.times[i]); } });
      var mn = Math.min.apply(null, P), mx = Math.max.apply(null, P), rg = (mx - mn) || 1, t0 = T[0], tr = (T[T.length - 1] - t0) || 1;
      var pts = P.map(function (v, i) { return [4 + (T[i] - t0) / tr * 312, 76 - (v - mn) / rg * 62]; });
      var d = pts.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join(" ");
      var lp = pts[pts.length - 1], col = P[P.length - 1] >= P[0] ? "var(--up)" : "var(--down)";
      var s = HWSignal.signal(x), vname = HW.t(s.verdict === "cop" ? "cop.name" : s.verdict === "sell" ? "sell.name" : "wait.name");
      var aside = document.querySelector(".sample");
      aside.setAttribute("aria-label", "Live sneaker card");
      aside.innerHTML = '<div>' + D.cover(x, "l", "") + '</div><div class="tag"><span>' + D.esc(HW.t("card.live")) + '</span><span>' + D.esc(HW.t("card.tag2")) + '</span></div>' +
        '<div><h3>' + D.esc(tit.name) + '</h3><span class="sku">' + D.esc(x.brand) + " · " + D.esc(x.sku) + '</span></div>' +
        '<div class="px"><b>' + D.esc(D.money(last)) + '</b>' + (c7 === null ? "" : '<span style="color:' + (c7 >= 0 ? "var(--up)" : "var(--down)") + '">' + D.esc(D.pct(c7, HW.locale())) + " · 7d</span>") + '</div>' +
        '<svg viewBox="0 0 320 90" role="img" aria-label="30-day price chart"><defs><linearGradient id="hg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs>' +
        '<line x1="0" y1="20" x2="320" y2="20" stroke="var(--line)" stroke-dasharray="2 5"/><line x1="0" y1="45" x2="320" y2="45" stroke="var(--line)" stroke-dasharray="2 5"/><line x1="0" y1="70" x2="320" y2="70" stroke="var(--line)" stroke-dasharray="2 5"/>' +
        '<path class="ln" pathLength="1" d="' + d + '" fill="none" stroke="url(#hg2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="' + lp[0].toFixed(1) + '" cy="' + lp[1].toFixed(1) + '" r="4.5" fill="' + col + '"/></svg>' +
