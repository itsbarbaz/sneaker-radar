name: Social image

# Crea ogni giorno l'immagine "Le sneaker piu' mosse oggi" e la pubblica sul ramo "social".
# Parte da sola dopo il bot "Sneaker Radar", oppure a mano da Actions.
on:
  workflow_run:
    workflows: ["Sneaker Radar"]
    types: [completed]
  workflow_dispatch:
    inputs:
      sku:
        description: "SKU della scarpa per lo spotlight (vuoto = scelta automatica)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  make-image:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Create image
        run: python scripts/social_image.py --out out
      - name: Create spotlight
        run: python scripts/social_spotlight.py --out out --sku "${{ github.event.inputs.sku }}"
        continue-on-error: true
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Create video
        run: python scripts/social_video.py --out out
      - name: Publish to social branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f out/today.png ]; then echo "Nessuna immagine da pubblicare oggi."; exit 0; fi
          REPO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --depth 1 --branch social "$REPO" /tmp/social 2>/dev/null || {
            mkdir /tmp/social && cd /tmp/social && git init -b social && git remote add origin "$REPO"
          }
          cd /tmp/social
          cp "$GITHUB_WORKSPACE/out/today.png" "$GITHUB_WORKSPACE/out/today-ig.png" "$GITHUB_WORKSPACE/out/today.mp4" "$GITHUB_WORKSPACE/out/caption.txt" .
          cp "$GITHUB_WORKSPACE/out/spotlight.png" "$GITHUB_WORKSPACE/out/spotlight.txt" . 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Social image $(date -u +%F)" || { echo "Nessun cambiamento"; exit 0; }
          git push origin social
