name: Validate Sneaker Watchlist

on:
  workflow_dispatch:

jobs:
  validate-watchlist:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Inspect KicksDB product
        env:
          KICKSDB_API_KEY: ${{ secrets.KICKSDB_API_KEY }}
        run: |
          set -o pipefail
          python scripts/validate_watchlist.py | tee kicksdb_product_inspection.txt

      - name: Upload inspection results
        uses: actions/upload-artifact@v4
        with:
          name: kicksdb-product-inspection
          path: kicksdb_product_inspection.txt
