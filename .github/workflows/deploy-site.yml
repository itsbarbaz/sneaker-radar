name: Deploy Site

# Pubblica la cartella site/ su GitHub Pages ad ogni modifica.

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_run:
    workflows: ["Sneaker Radar"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build model pages and sitemap
        run: python scripts/build_seo.py --site site
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
